spring:
  application:
    name: chat-ads-eval
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      # A hosted Redis in another region needs more than the local default; see application-demo.yml.
      timeout: ${CHATADS_REDIS_TIMEOUT:250ms}
      connect-timeout: ${CHATADS_REDIS_CONNECT_TIMEOUT:250ms}
      # For a hosted Redis set SPRING_DATA_REDIS_URL=rediss://default:<password>@<host>:6379 (TLS comes
      # from the rediss scheme and the url wins over host and port), or set SPRING_DATA_REDIS_PASSWORD
      # and SPRING_DATA_REDIS_SSL_ENABLED=true next to the host and port.

server:
  port: ${PORT:8080}

chatads:
  # Postgres (full-text + pgvector). Leave the url empty to run on the in-memory keyword retriever only.
  # The url may be jdbc:postgresql://... or a postgresql://user:password@host/db string; add
  # sslmode=require for a hosted database.
  db:
    url: ${CHATADS_DB_URL:}
    user: ${CHATADS_DB_USER:}
    password: ${CHATADS_DB_PASSWORD:}
    pool-size: ${CHATADS_DB_POOL_SIZE:4}
    connect-timeout: ${CHATADS_DB_CONNECT_TIMEOUT:PT1S}
  # Hosted public demo: forces the offline embedder. The demo profile turns this on.
  demo:
    enabled: ${CHATADS_DEMO:false}
  # Requests per minute per client address on /v1/. Zero turns it off.
  rate-limit:
    per-minute: ${CHATADS_RATE_LIMIT_PER_MINUTE:0}
  retrieval:
    candidates: 20
    rrf-k: 60
    # A vector hit counts only at or above this cosine similarity. Tuned on the synthetic eval set
    # for the hash embedder; a real embedding model needs its own value.
    min-similarity: ${CHATADS_MIN_SIMILARITY:0.25}
    # ...and must also reach this share of the best vector hit's similarity.
    vector-relative-cutoff: 0.5
    # After a Postgres or embedding failure, answer from the keyword retriever for this long.
    fallback-cooldown: PT5S
  embedding:
    # hash = deterministic offline embedder (default). openai = any OpenAI-compatible /embeddings API. ollama = local Ollama.
    provider: ${CHATADS_EMBEDDING_PROVIDER:hash}
    dimensions: ${CHATADS_EMBEDDING_DIMENSIONS:256}
    base-url: ${CHATADS_EMBEDDING_BASE_URL:}
    model: ${CHATADS_EMBEDDING_MODEL:}
    api-key: ${CHATADS_EMBEDDING_API_KEY:}
    # A local model that is not loaded yet can take several seconds on its first call.
    timeout: ${CHATADS_EMBEDDING_TIMEOUT:PT10S}
  cache:
    enabled: ${CHATADS_CACHE_ENABLED:false}
    ttl: ${CHATADS_CACHE_TTL:PT10M}

management:
  endpoint:
    health:
      probes:
        enabled: true
  health:
    # Redis and Postgres are optional paths with a fallback, so they must not turn the pod unready.
    redis:
      enabled: false
    db:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    distribution:
      # Bucketed histograms so Prometheus can compute p95 latency.
      percentiles-histogram:
        http.server.requests: true
