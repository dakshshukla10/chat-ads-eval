# Local clusters only. These dependencies use disposable storage and are not for production.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: chat-ads
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: pgvector/pgvector:pg16
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: chatads
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: chat-ads-config
                  key: CHATADS_DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: chat-ads-secrets
                  key: CHATADS_DB_PASSWORD
          readinessProbe:
            exec:
              command: [pg_isready, -U, chatads, -d, chatads]
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: chat-ads
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: chat-ads
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      automountServiceAccountToken: false
      containers:
        - name: redis
          image: redis:7-alpine
          args: [--save, "", --appendonly, "no", --maxmemory, 32mb, --maxmemory-policy, allkeys-lru]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: [redis-cli, ping]
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 48Mi
            limits:
              cpu: 100m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: chat-ads
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: redis
