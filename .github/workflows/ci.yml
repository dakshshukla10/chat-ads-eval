name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test
        run: ./mvnw -B verify

  image:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: ghcr.io/dakshshukla10/chat-ads-eval:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check container health and sponsored response
        shell: bash
        run: |
          set -euo pipefail
          trap 'result=$?; if [ "$result" -ne 0 ]; then docker logs chat-ads-smoke; fi; exit "$result"' EXIT
          docker run -d --name chat-ads-smoke --memory=512m --cpus=1 \
            --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            -p 127.0.0.1:8080:8080 \
            ghcr.io/dakshshukla10/chat-ads-eval:${{ github.sha }}
          ready=false
          for _ in {1..60}; do
            if curl -fsS --max-time 2 http://127.0.0.1:8080/actuator/health | jq -e '.status == "UP"' \
              && [ "$(docker inspect --format '{{.State.Health.Status}}' chat-ads-smoke)" = healthy ]; then
              ready=true
              break
            fi
            sleep 2
          done
          [ "$ready" = true ]
          curl -fsS --max-time 10 http://127.0.0.1:8080/v1/ads/contextual \
            -H 'Content-Type: application/json' \
            -d '{"prompt":"running shoes for a marathon"}' \
            | jq -e '.sponsored | length > 0 and all(.[]; .label == "Sponsored")'
      - name: Remove test container
        if: always()
        run: docker rm -f chat-ads-smoke
      - name: Log in to image registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push checked image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/dakshshukla10/chat-ads-eval:latest
            ghcr.io/dakshshukla10/chat-ads-eval:${{ github.sha }}
          cache-from: type=gha
